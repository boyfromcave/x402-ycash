# x402-ycash CI (plan §6; workspace CI/CD design 2026-10-06).
#
# Push / PR tier (every push and pull request on the branches below), four parallel jobs:
#   unit               npm workspaces: eslint, tsc (typecheck), vitest unit tests
#   light              the Rust Sapling light client (light/): fmt, clippy (-D warnings), test
#   python             the Python bindings (python/, its own venv): ruff, mypy, pytest
#   facilitator-image  the facilitator's Docker image builds and refuses to start unconfigured
# Nightly tier (workflow_dispatch with tier=nightly; component repos carry no schedule, the node
# lines do):
#   devnet             `npm run test:devnet` (mechanism + the HTTP path) on a five-node regtest
#                      devnet of the node line matching this branch (scripts/devnet.sh)
#
# Third-party actions are pinned by commit, never by tag; the comment carries the tag (bump both).
name: ci

on:
  push:
    # The one branch list: harden/yellowback (P1 hardening), upgrade/vault (the network upgrade),
    # main (the branch of record, AGENTS.md rule 2).
    branches: &branches [main, harden/yellowback, upgrade/vault]
  pull_request:
    branches: *branches
  workflow_dispatch:
    inputs:
      tier:
        description: "push = the push/PR jobs only; nightly = also the devnet job"
        type: choice
        options: [push, nightly]
        default: push
      node_run_id:
        description: "nightly: a run id of the node line's yellowback-tests workflow to take ycashd from (empty = the newest run on the matching branch that has the artifact)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # light/ has no rust-toolchain.toml; CI pins the release the developers build with (it was
  # `stable`, which moves under the clippy -D warnings gate).
  RUST_TOOLCHAIN: 1.92.0
  NODE_VERSION: 22
  PYTHON_VERSION: "3.13"
  # light/Cargo.toml: the librustzcash6 crates are path dependencies at ../../librustzcash6, i.e. a
  # sibling of this repository: boyfromcave/librustzcash6 @ ec525fae (= miodragpop/librustzcash, the
  # revision ycashd 6.21.0 pins).
  LIBRUSTZCASH6_REV: ec525fae828ff67af0bf5d1995acfe445340ce66

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # npm's download cache, keyed by setup-node on package-lock.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  light:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # actions/checkout cannot write outside the workspace, so a plain git clone puts it there.
      - name: clone librustzcash6 beside the repo
        run: |
          git clone --filter=blob:none https://github.com/boyfromcave/librustzcash6.git "$GITHUB_WORKSPACE/../librustzcash6"
          git -C "$GITHUB_WORKSPACE/../librustzcash6" checkout --quiet "$LIBRUSTZCASH6_REV"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (master, 2026-10-01)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      # Keyed by rust-cache on rustc, light/Cargo.lock and the job, plus the sibling revision (path
      # dependencies are not in the lock's hash); saved from pushes only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: light
          key: lrz6-${{ env.LIBRUSTZCASH6_REV }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --check
        working-directory: light
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: light
      - run: cargo test --locked
        working-directory: light

  facilitator-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build the facilitator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/facilitator/Dockerfile
          tags: x402-ycash-facilitator:ci
          load: true
          push: false
          # Layer cache in the Actions cache, scoped per branch by GitHub; never pushed anywhere.
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - name: the image starts and refuses to run without a network (config validation)
        run: |
          set +e
          out=$(docker run --rm x402-ycash-facilitator:ci 2>&1); code=$?
          echo "$out"
          [ "$code" -ne 0 ] && echo "$out" | grep -q X402_NETWORK

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # uv's download cache, keyed on python/pyproject.toml (the project has no lock file).
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml
      - run: uv venv --python "$PYTHON_VERSION" .venv
      - run: uv pip install --python .venv/bin/python -e . pytest pytest-asyncio mypy ruff
      - run: .venv/bin/ruff check x402_ycash tests
      - run: .venv/bin/mypy x402_ycash
      - run: .venv/bin/python -m pytest

  # Nightly tier, on demand. The devnet needs a ycashd: building one here costs > 60 min uncached
  # (depends tree, Rust, C++), downloading the node line's own CI build artifact costs seconds, so
  # this job downloads (NODE_ARTIFACT: the node line's yellowback-tests `build` job artifact
  # `node-bin`, ycash-dd's node-bin.tar with src/ycashd and src/ycash-cli executable; 3 days).
  # Node branch: upgrade/vault -> upgrade/vault (whose
  # devnet tool activates the Vault upgrade itself), harden/yellowback -> harden/yellowback,
  # anything else -> ycash-dd's branch of record. scripts/devnet.sh wants the workspace layout:
  # ws/ycash-dd (with src/ycashd), ws/x402-ycash, a Python with the test framework's packages.
  # Not here: light/'s regtest test (it needs lightwalletd-dd as well) and the Python devnet
  # parity runs; both stay on the owner's nightly machine.
  devnet:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_REPO: boyfromcave/ycash-dd
      NODE_OF_RECORD: feature/yellowback-price-attest
      NODE_ARTIFACT: node-bin
      NODE_RUN_ID: ${{ inputs.node_run_id }}
      REF_NAME: ${{ github.ref_name }}
      DEVNET_SEED: 181
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ws/x402-ycash
          persist-credentials: false
      - name: node branch for this run
        id: node
        run: |
          case "$REF_NAME" in
            upgrade/vault|harden/yellowback) branch=$REF_NAME ;;
            *) branch=$NODE_OF_RECORD ;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "node line $NODE_REPO @ $branch"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.NODE_REPO }}
          ref: ${{ steps.node.outputs.branch }}
          path: ws/ycash-dd
          persist-credentials: false
      - name: download ycashd from the node line's CI
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_BRANCH: ${{ steps.node.outputs.branch }}
        run: |
          dst="$GITHUB_WORKSPACE/ws/ycash-dd"
          if [ -n "$NODE_RUN_ID" ]; then runs=$NODE_RUN_ID; else
            runs=$(gh run list -R "$NODE_REPO" -w yellowback-tests.yml -b "$NODE_BRANCH" -L 20 --json databaseId -q '.[].databaseId')
          fi
          for r in $runs; do
            if gh run download "$r" -R "$NODE_REPO" -n "$NODE_ARTIFACT" -D "$RUNNER_TEMP/dl" 2>/dev/null; then
              echo "ycashd from $NODE_REPO run $r"; break
            fi
          done
          # node-bin holds one tar that keeps the executable bits, with src/ycashd and src/ycash-cli
          # (plus test binaries) at its root: ycash-dd uploads node-bin.tar, ycash6 node-bin.tgz.
          if [ -f "$RUNNER_TEMP/dl/node-bin.tar" ]; then tar -xf "$RUNNER_TEMP/dl/node-bin.tar" -C "$dst" src/ycashd src/ycash-cli
          elif [ -f "$RUNNER_TEMP/dl/node-bin.tgz" ]; then tar -xzf "$RUNNER_TEMP/dl/node-bin.tgz" -C "$dst" src/ycashd src/ycash-cli
          else echo "::error::no artifact $NODE_ARTIFACT (node-bin.tar / node-bin.tgz) in $NODE_REPO runs on $NODE_BRANCH ($runs)"; ls -lR "$RUNNER_TEMP/dl" 2>/dev/null || true; exit 1; fi
          test -x "$dst/src/ycashd" && test -x "$dst/src/ycash-cli"
          ls -l "$dst/src"
      - name: cache zcash params
        id: params
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('ws/ycash-dd/zcutil/fetch-params.sh') }}
      - if: steps.params.outputs.cache-hit != 'true'
        run: ws/ycash-dd/zcutil/fetch-params.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # The workspace venv's packages (workspace requirements.txt) and its pyblake2 shim
      # (scripts/bootstrap.sh), which the inherited test framework imports.
      - name: devnet venv
        run: |
          python -m venv ws/.venv
          ws/.venv/bin/pip install --quiet "pyasyncore>=1.0.4" "pyzmq>=25" "requests>=2.31" "simplejson>=3.19"
          site=$(ws/.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          printf '%s\n' 'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
          ws/.venv/bin/python -c 'import asyncore, zmq, requests, simplejson, pyblake2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ws/x402-ycash/package-lock.json
      - run: npm ci
        working-directory: ws/x402-ycash
      - name: devnet up, npm run test:devnet, down
        working-directory: ws/x402-ycash
        run: |
          export YELLOWBACK_WORKSPACE="$GITHUB_WORKSPACE/ws" PYTHON="$GITHUB_WORKSPACE/ws/.venv/bin/python"
          export X402_SCRATCH="$RUNNER_TEMP/x402"
          trap 'scripts/devnet.sh down dd "$DEVNET_SEED" || true' EXIT
          scripts/devnet.sh up dd "$DEVNET_SEED"
          X402_DEVNET_JSON="$X402_SCRATCH/dd-$DEVNET_SEED/devnet.json" npm run test:devnet
      - name: upload devnet logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x402-devnet-logs
          path: ${{ runner.temp }}/x402/**/*.log
          if-no-files-found: ignore
