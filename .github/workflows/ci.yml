name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  light:
    # The Ycash Sapling light client (light/). Its librustzcash6 crates are git dependencies
    # (boyfromcave/librustzcash6 @ 4867cf85, light/Cargo.toml); cargo fetches them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: light }
      - run: cargo fmt --check
        working-directory: light
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: light
      - run: cargo test
        working-directory: light
  facilitator-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the facilitator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/facilitator/Dockerfile
          tags: x402-ycash-facilitator:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image starts and refuses to run without a network (config validation)
        run: |
          set +e
          out=$(docker run --rm x402-ycash-facilitator:ci 2>&1); code=$?
          echo "$out"
          [ "$code" -ne 0 ] && echo "$out" | grep -q X402_NETWORK
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 .venv
      - run: uv pip install --python .venv/bin/python -e . pytest pytest-asyncio mypy ruff
      - run: .venv/bin/ruff check x402_ycash tests
      - run: .venv/bin/mypy x402_ycash
      - run: .venv/bin/python -m pytest
