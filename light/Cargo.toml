[package]
name = "x402-ycash-light"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "A Sapling light client for x402 agents on Ycash: sync from lightwalletd, build and sign shielded payments offline"
license = "MIT"

[[bin]]
name = "x402-light"
path = "src/main.rs"

[dependencies]
# librustzcash, Ycash-aware fork: boyfromcave/librustzcash6 @ 4867cf85 = miodragpop/librustzcash
# ec525fae (the revision ycashd 6.21.0 pins) plus the Vault network upgrade (BranchId::Vault =
# 0x6d5b7a31), the revision ycashd's upgrade/vault Cargo.toml pins. See README "Pinning".
zcash_client_backend = { version = "0.22", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", features = ["lightwalletd-tonic", "unstable", "non-standard-fees"] }
zcash_client_sqlite = { version = "0.20", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", features = ["unstable"] }
zcash_keys = { version = "0.14", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", features = ["sapling", "unstable"] }
zcash_primitives = { version = "0.28", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", features = ["non-standard-fees"] }
zcash_proofs = { version = "0.28", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", features = ["local-prover", "multicore"] }
zcash_protocol = { version = "0.9", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011", features = ["local-consensus"] }
zcash_address = { version = "0.12", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zip321 = { version = "0.8", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
zip32 = "0.2"
bip0039 = "0.12"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.8"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `router` for the unit tests' in-process fake lightwalletd (src/fake_lwd.rs); test builds only.
tonic = { version = "0.14", default-features = false, features = ["router"] }
# spend_diff_tests: an authorization type with no transparent inputs, to recompute a signed tx's sighash.
zcash_transparent = { version = "0.8", git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }

# Mirror of ycash6 upgrade/vault Cargo.toml:130-136 (ref/ycash6/Cargo.toml:122-133 before Vault) so every transitive zcash_* crate resolves to the same
# Ycash-aware source as ycashd 6.21.0 (one revision, one set of branch ids and HRPs).
[build-dependencies]
tonic-prost-build = "0.14"

[patch.crates-io]
zcash_protocol = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zcash_primitives = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
f4jumble = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zcash_address = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zcash_encoding = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zcash_transparent = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
# Not in ycashd's list (it does not use them) but needed here so the path crates above see one copy:
zcash_client_backend = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zcash_keys = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zip321 = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }
zcash_proofs = { git = "https://github.com/boyfromcave/librustzcash6.git", rev = "4867cf85199a6fc734bf4027bd001e9e4fca0011" }

[profile.release]
lto = "thin"
codegen-units = 1

# Proving in an unoptimised build takes minutes; keep dependencies optimised even for `cargo test`.
[profile.dev.package."*"]
opt-level = 3
