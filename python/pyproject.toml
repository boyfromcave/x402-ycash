[project]
name = "x402-ycash"
version = "0.1.0"
description = "Ycash bindings for the x402 Python SDK: the exact scheme (YEC) facilitator and server, the v4 transaction codec and the Yellowback TRANSFER codec"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "x402>=2.25.0,<3",
    "httpx>=0.28.1",
    "coincurve>=21.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x402_ycash"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
